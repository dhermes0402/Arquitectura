services:

  contenedor_bd:
    image: mysql:5.7
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: empresa
    volumes:
      - micro_db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app_network

  login:
    build: ./login
    ports:
      - "5000:5000"
    environment:
      DB_HOST: contenedor_bd
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME_AUTH: authentication
    networks:
      - app_network
    depends_on:
      - contenedor_bd

  api:
    build: ./api
    ports:
      - "5001:5001"
    environment:
      DB_HOST: contenedor_bd
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME_SHOP: shop
      LOGIN_SERVICE: http://login:5000
    networks:
      - app_network
    depends_on:
      - contenedor_bd
      - login

  php:
    build: ./php
    ports:
      - "8080:80"
    environment:
      LOGIN_SERVICE: http://localhost:5000
      API_SERVICE: http://localhost:5001
    networks:
      - app_network
    depends_on:
      - login
      - api

volumes:
  micro_db_data:

networks:
  app_network: